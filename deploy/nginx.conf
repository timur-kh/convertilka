# Фрагмент конфигурации nginx для Конвертилки.
# Вставьте внутрь блока server { ... } вашего сайта и перезагрузите nginx: sudo nginx -t && sudo systemctl reload nginx

root /var/www/convertilka/site;   # ← путь к папке site/ на сервере
index index.html;

# Своя страница «не найдено» (с поиском и секретным уровнем). В ISPmanager: «Сайты» → сайт →
# «Страницы ошибок» → для 404 укажите /404.html — или добавьте эту строку в конфиг вручную.
error_page 404 /404.html;

# Типы файлов, которых нет в стандартном mime.types
types {
    text/javascript                       js mjs;
    application/wasm                      wasm;
    application/manifest+json             webmanifest;
}

# Заголовки безопасности (то же, что site/_headers для Cloudflare/Netlify)
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Сжатие текста (wasm, js, css — сотни килобайт экономии)
gzip on;
gzip_types text/javascript application/javascript text/css application/json image/svg+xml application/wasm application/manifest+json;

# ВАЖНО про кэш. Сейчас сервер отдаёт JS и CSS с «Cache-Control: max-age=3888000» (45 дней) —
# из-за этого посетители месяц не получают обновления сайта. Скорее всего, где-то в конфиге
# (или в панели хостинга) стоит «expires 45d» для js/css. Ниже для нашего кода он отключён.
#
# Внимание: если внутри location есть свой add_header, nginx НЕ наследует add_header с уровня server —
# поэтому в каждом location ниже заголовки безопасности повторены через include-подобный блок.

# Наш код и страницы — браузер каждый раз сверяется с сервером (ответ 304, если файл не менялся)
location /assets/ {
    expires off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Библиотеки неизменны внутри версии — кэш на месяц
location /vendor/ {
    expires off;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Service worker всегда свежий
location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Страницы (в т.ч. /heic-to-jpg/ → /heic-to-jpg/index.html) — тоже со сверкой
location / {
    expires off;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri $uri/ =404;
}
